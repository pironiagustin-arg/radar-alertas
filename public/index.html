<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de Alertas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>Radar de Alertas</div>
  <div class="top-r">
    <span id="asof" class="muted"></span>
    <button id="btnNotif" class="ghost" title="Notificaciones del navegador">🔔</button>
    <button id="btnRefresh" class="primary">Actualizar</button>
  </div>
</header>

<section id="market" class="market"></section>

<nav class="tabs">
  <button data-tab="resumen" class="on">Resumen</button>
  <button data-tab="sectores">Sectores</button>
  <button data-tab="ranking">Ranking</button>
  <button data-tab="carteras">Carteras</button>
  <button data-tab="ia">IA ✦</button>
  <button data-tab="grupos">Grupos</button>
  <button data-tab="tesis">Tesis</button>
  <button data-tab="alertas">Alertas <span id="alertCount" class="badge"></span></button>
  <button data-tab="ajustes">Ajustes</button>
</nav>

<main>
  <section id="tab-resumen" class="tab on"></section>
  <section id="tab-sectores" class="tab"></section>
  <section id="tab-ranking" class="tab"></section>
  <section id="tab-carteras" class="tab"></section>
  <section id="tab-ia" class="tab"></section>
  <section id="tab-grupos" class="tab"></section>
  <section id="tab-tesis" class="tab"></section>
  <section id="tab-alertas" class="tab"></section>
  <section id="tab-ajustes" class="tab"></section>
</main>

<aside id="drawer" class="drawer"><div class="drawer-in" id="drawerIn"></div></aside>
<div id="scrim" class="scrim"></div>
<div id="toast" class="toast"></div>
<div id="cmp" class="modal"></div>
<div id="login" class="modal"><div class="modal-in">
  <h3>Radar de Alertas</h3>
  <p class="muted">Ingresá tu contraseña (APP_PASSWORD) para activar la IA, Telegram y la sincronización.</p>
  <input type="password" id="loginPass" placeholder="Contraseña" style="width:100%;margin:8px 0">
  <div id="loginErr" class="neg" style="font-size:12px;min-height:16px"></div>
  <div class="row spread"><button class="ghost" id="loginSkip">Usar sin cuenta</button><button class="primary" id="loginBtn">Entrar</button></div>
</div></div>

<script type="module" src="app.js"></script>
</body>
</html>
